spring:
  application:
    name: inscheck
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inscheck}
    username: ${DB_USER:inscheck}
    password: ${DB_PASSWORD:inscheck}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Соединение не создаётся при старте — только при первом запросе к БД.
      initialization-fail-timeout: -1

server:
  port: ${SERVER_PORT:8080}

# WSDL доступен по адресу: http://<host>:<port>/ws/inscheck.wsdl
# Эндпоинт SOAP: http://<host>:<port>/ws
