spring:
  application:
    name: inscheck
  datasource:
    # Подключение к БД. Таблицы УЖЕ существуют — приложение их не создаёт и не меняет
    # (JPA/ddl-auto нет, schema.sql автоматически не выполняется).
    # Впиши имя базы (ИМЯ_БАЗЫ), при необходимости порт, логин и пароль.
    # Любое значение можно переопределить переменной окружения (DB_URL/DB_USER/DB_PASSWORD).
    url: ${DB_URL:jdbc:postgresql://10.0.15.33:5432/ИМЯ_БАЗЫ}
    username: ${DB_USER:ЛОГИН}
    password: ${DB_PASSWORD:ПАРОЛЬ}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Соединение не создаётся при старте — только при первом запросе к БД.
      initialization-fail-timeout: -1

server:
  port: ${SERVER_PORT:8080}

# На время отладки — трассировка поиска СП/ПЗСК (кандидаты, состав СК*, выбор ПЗСК).
# Убрать (или поставить INFO), когда сверка со старым сервисом завершится.
logging:
  level:
    ru.iac.inscheck: DEBUG

# WSDL доступен по адресу: http://<host>:<port>/ws/inscheck.wsdl
# Эндпоинт SOAP: http://<host>:<port>/ws
