# Профиль local (по умолчанию) — локальная разработка/сборка.
# Значения переопределяются переменными окружения DB_URL/DB_USER/DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inscheck}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
