# Профиль test — сборка для тестового сервера (mvn ... -P test).
#
# Общие для сервисов ТФОМС значения (URL БД, пароли по логину, adресa и т.п.) лежат в
# защищённом файле на сервере и подключаются на старте. optional: — чтобы war запускался
# и без файла (например, при локальной проверке профиля test).
spring.config.import=optional:file:/opt/tomcat/tfoms/conf/common.properties

# Как в остальных сервисах: указываем ЛОГИН, а пароль берётся из common.properties по
# ключу, равному этому логину (password=${<логин>}). Замени слово «логин» на реальный
# логин БД (в ОБЕИХ строках) — тогда в common.properties должен быть ключ <логин>=<пароль>.
spring.datasource.username=логин
spring.datasource.password=${логин}

# Базовый URL БД тоже берётся из common.properties. ВНИМАНИЕ: urlPostgreSQLTest — общий
# ключ (та же БД, что у других сервисов). Если таблицы InsCheck лежат в ОТДЕЛЬНОЙ базе —
# используй соответствующий ключ (или попроси добавить его в common.properties).
spring.datasource.url=${urlPostgreSQLTest}?ApplicationName=${app.name}App
