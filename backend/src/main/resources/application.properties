# Активный профиль зашивается при сборке Maven-профилем: -P test → test, иначе local.
# (@activatedProperties@ подставляется фильтрацией ресурсов из spring-boot-starter-parent.)
spring.profiles.active=@activatedProperties@

app.name=InsCheckR

# Пул соединений (единый стиль с остальными сервисами ТФОМС).
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=${app.name}Pool
# Соединение создаётся лениво — war стартует даже без доступной БД (WSDL открывается,
# запросы к БД возвращают errcode 2, пока БД недоступна/не настроена).
spring.datasource.hikari.initialization-fail-timeout=-1

# Диагностика поиска СП/ПЗСК на время сверки со старым сервисом (после сверки — INFO).
logging.level.ru.iac.inscheck=DEBUG

# Отдельный файл лога (как у других сервисов ТФОМС): ${java.io.tmpdir}/InsCheckR.log.
# Туда попадает и стек упавшего запроса (log.error "Ошибка обработки GetInsPrkState … Caused by …"),
# по которому видно, какой именно SQL/таблица не найдены на сервере.
logging.file.name=${java.io.tmpdir}/${app.name}.log
logging.pattern.file=%d %p %c{1.} [%t] %m%n

# Эндпоинт SOAP:  http://<host>:<port>[/<контекст>]/ws
# WSDL:           .../ws/inscheck.wsdl
